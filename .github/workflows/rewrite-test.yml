name: Deploy the rewrite to test

# The rewrite's test environment on Cloudflare: Worker gp-test, D1 gp-test-global and R2 gp-test-media, as
# rewrite/apps/server/wrangler.test.toml names them (rewrite/docs/cloudflare.md, "The test environment").
#
#   push to main touching rewrite/  → deploys main
#   workflow_dispatch               → deploys the chosen branch (the file must be on main for the button)
#
# Only the web app is built: wrangler bundles the Worker from the server's sources itself. Typecheck, lint and the
# unit and server tests run first, and a failure deploys nothing. Needs the repository secrets
# CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit, Workers R2 Storage: Edit) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: ['main']
    paths:
      - 'rewrite/**'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a newer one waits rather than cancelling a deploy halfway.
concurrency:
  group: rewrite-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: rewrite-test
      url: https://gp-test.lars-arvidsson.workers.dev
    defaults:
      run:
        working-directory: rewrite
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: rewrite/package.json
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: rewrite/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # Nothing is deployed that does not pass the checks a commit must (rewrite/AGENTS.md).
      - name: Check
        run: pnpm typecheck && pnpm lint && pnpm test
      - name: Build the web app
        run: pnpm exec turbo run build --filter=@gp/web
        env:
          GP_COMMIT: ${{ github.sha }}
      - name: Deploy
        # The version named by its commit, so `wrangler rollback` finds the one before; the message through the
        # environment, never written into the script, as a commit message may hold anything.
        run: pnpm --filter @gp/server exec wrangler deploy --config wrangler.test.toml --tag "${GITHUB_SHA::7}" --message "$(printf '%s' "$MESSAGE" | head -n 1 | cut -c 1-100)"
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'workflow_dispatch' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: Publish the Docker image

# The server with the web app beside it (apps/server/Dockerfile, docs/self-hosting.md), published as
# ghcr.io/larsabrasha/gospelpresenter-server: `latest` and the commit's `sha-…` on a push to main that touches what the
# image is built from, for amd64 and arm64 (a Raspberry Pi, an Apple Silicon Mac). A pull request builds it and throws it
# away, so a broken Dockerfile shows before the merge. A new name, not 1.x's image: an old compose file pulling
# `gospelpresenter` never gets 2.0 by surprise.

on:
  push:
    branches: ['main']
    paths:
      - 'apps/server/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'packages/sync/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    paths:
      - 'apps/server/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'packages/sync/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gospelpresenter-server

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: GP_COMMIT=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Create and publish a Docker image

# Two channels, one workflow:
#
#   push to main         → :main and :sha-<commit>    — what the test environment tracks
#   push tag v1.2.3      → :1.2.3, :1.2, :latest      — what production pins to
#   workflow_dispatch    → :<branch name>             — trying a branch in test before it merges
#   pull request         → built, pushed nowhere      — see below
#
# Pull requests build both images and throw them away. Without that nothing builds a container until
# after a merge, and the two failures that put main red on 2026-08-31 lived only inside one: the SDK
# pin, which the runner satisfies from setup-dotnet but a container has to satisfy from its base
# image, and the Tailwind CLI, whose actions/cache sits on the runner where a container cannot reach
# it. Both were invisible to a green pull request by construction. A public repository pays nothing
# for GitHub-hosted runners, so this costs waiting time and no money.
#
# The sha tag is written on every build and is the only immutable one. :main and :latest both move,
# so neither can answer "which build is running" after the fact, and neither is a rollback target.
#
# One tag releases the whole product. v1.2.3 is also what desktop-release.yml triggers on, so a
# release builds the server images and the Electron installers from the same commit and gives them
# the same version number -- there is one Gospel Presenter, not a server that versions separately
# from its desktop client. The cost is accepted deliberately: a server-only fix still occupies three
# platform runners packaging installers nobody asked for, and a desktop-only fix still republishes
# the server images. On a public repository that is runner time, not money, and the alternative was
# two version numbers that drift apart and a prefix everyone has to remember.
#
# There is deliberately no paths filter any more. A filter here would have to hold for tag pushes
# too, and a tag placed on a commit that is already on main carries no file diff for it to match --
# so the release build would be skipped for the reason least likely to be guessed. Rebuilding on a
# docs-only commit costs a cached no-op; a release that silently does not build costs an evening.

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    # A paths filter is safe on this event and not on the push above: a pull request always has a
    # diff to match against, where a tag placed on an already-pushed commit has none. So a pull
    # request touching only docs or adr does not build images, and a release tag always does.
    paths:
      - 'GospelPresenter/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Same reason as maui-build.yml: Tailwind.MSBuild fetches the standalone CLI from the GitHub API
  # without a token, and shared runner addresses get rate limited. A cacheable install path lets the
  # job restore the binary instead of fetching it.
  TailwindInstallPath: ${{ github.workspace }}/.tailwind-cli/

# Every dotnet command runs from GospelPresenter/, because that is where global.json lives and SDK
# selection walks up from the working directory.
defaults:
  run:
    working-directory: GospelPresenter

jobs:
  # maui-build.yml runs the same suites on pushes to main and on pull requests, but not on tags --
  # so without this job a v* release would publish the production image having run no test at
  # all. Duplicated deliberately: a release that gates on a workflow it does not control is a
  # release that can be published green while the tests were never scheduled.
  #
  # Restricted to the events maui-build.yml does not cover, so main pushes and pull requests do not
  # run the same two suites twice.
  tests:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache the Tailwind CLI
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.tailwind-cli
          key: tailwind-cli-${{ runner.os }}-${{ hashFiles('GospelPresenter/GospelPresenter.Shared/GospelPresenter.Shared.csproj') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: GospelPresenter/global.json

      - name: Unit tests
        run: dotnet test GospelPresenter.UnitTests/GospelPresenter.UnitTests.csproj

      - name: Integration tests
        run: dotnet test GospelPresenter.IntegrationTests/GospelPresenter.IntegrationTests.csproj

  build-and-push-image:
    needs: tests
    # A job whose dependency was skipped is itself skipped, unless its condition uses a status
    # function -- which is what !cancelled() is here for. So this runs when the gate passed and when
    # the gate did not apply, and only a real test failure stops it.
    if: ${{ !cancelled() && needs.tests.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      matrix:
        include:
          - name: web
            dockerfile: GospelPresenter/GospelPresenter.Web/Dockerfile
            suffix: ""
          - name: migrations
            dockerfile: GospelPresenter/GospelPresenter.MigrationService/Dockerfile
            suffix: "-migrations"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        # Nothing is pushed from a pull request, so no credentials are needed. The layer cache is
        # unaffected: cache-from type=gha reads the Actions cache, not the registry.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
          # latest=auto is metadata-action's default, stated here rather than inherited because it
          # decides what production follows: it moves :latest onto a semver tag and, importantly,
          # leaves it alone for a prerelease, so v1.4.0-rc.1 never becomes what an unpinned
          # deployment pulls. {{major}}.{{minor}} is skipped for prereleases for the same reason.
          flavor: latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: GospelPresenter
          file: ${{ matrix.dockerfile }}
          # A pull request builds and keeps nothing. The point is that the build ran at all.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Generate artifact attestation
        # Nothing was pushed from a pull request, so there is no digest in the registry to attest.
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

name: Release the macOS app

# Builds, packages and publishes the Mac Catalyst app when a version tag is pushed. See
# adr/0002-app-distribution-and-updates.md, in particular (7)-(11) for why a tag is the trigger and
# why one tag becomes three different version strings.
#
# NOT SIGNED OR NOTARIZED. There is no Apple Developer Program membership yet, so vpk is run without
# --signAppIdentity / --signInstallIdentity / --notaryProfile, which makes it skip both steps. The
# consequence is not cosmetic and belongs in the release notes: macOS Sequoia removed the
# Control-click Gatekeeper bypass, so the FIRST install takes the user through System Settings ->
# Privacy & Security -> "Open Anyway" -> confirm. Updates after that are expected to apply silently,
# because the quarantine flag is set by the browser that downloads a file and not by an app
# replacing its own bundle -- expected, but unverified until someone runs it end to end.
# The four lines to uncomment once the certificate exists are marked TODO(signing) below.

on:
  push:
    tags: ['v*']
  # Lets a release be re-run without moving the tag, e.g. after a failed upload, and lets the whole
  # pipeline be exercised without putting anything in front of users. NOTE: GitHub only offers
  # workflow_dispatch once the workflow file is on the DEFAULT branch, so until this is merged the
  # only way to run it is to push a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.2.0)'
        required: true
      draft:
        description: 'Leave the GitHub release as a draft instead of publishing it'
        type: boolean
        default: true

defaults:
  run:
    working-directory: GospelPresenter

env:
  # Same reason as in maui-build.yml: Tailwind.MSBuild fetches its CLI from the GitHub API
  # unauthenticated and intermittently gets rate limited.
  TailwindInstallPath: ${{ github.workspace }}/.tailwind-cli/
  # Stable across every release. Velopack keys the installed app's update directory on it, so
  # changing it later would orphan every existing installation.
  PACK_ID: GospelPresenter

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      # vpk upload github creates the release and attaches the packages.
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Work out the three versions this tag becomes
        id: version
        working-directory: .
        run: |
          set -euo pipefail
          raw="${{ github.event.inputs.tag || github.ref_name }}"
          semver="${raw#v}"

          # Velopack sorts the update feed on the full semver, prerelease suffix and all.
          echo "semver=$semver" >> "$GITHUB_OUTPUT"

          # CFBundleShortVersionString takes one to three period-separated integers and rejects a
          # prerelease suffix, so the display version is the semver with everything from the first
          # '-' onwards removed.
          echo "display=${semver%%-*}" >> "$GITHUB_OUTPUT"

          # The channel follows the suffix: a tag with one is a beta, a bare tag is stable. Both
          # talk to the production server -- the channel decides which releases reach a device, not
          # which server it syncs with.
          if [ "$semver" = "${semver%%-*}" ]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Tag $raw -> semver $semver, display ${semver%%-*}, run ${{ github.run_number }}"

      - name: Cache the Tailwind CLI
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.tailwind-cli
          key: tailwind-cli-${{ runner.os }}-${{ hashFiles('GospelPresenter/GospelPresenter.Shared/GospelPresenter.Shared.csproj') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: GospelPresenter/global.json

      - name: Install the pinned MAUI workloads
        # From the app's own directory, because the workloadVersion pin lives beside the app rather
        # than at the repository root -- the same trap documented at length in maui-build.yml.
        working-directory: GospelPresenter/GospelPresenter
        run: dotnet workload restore GospelPresenter.csproj

      - name: Select the Xcode the pinned workload set expects
        run: |
          app=$(ls -d /Applications/Xcode_26.3*.app 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            echo "::error::Xcode 26.3 is not on this runner image, but the pinned workload set requires it. Raise the pin and this step together."
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version

      - name: Publish the Mac Catalyst app
        run: |
          dotnet publish GospelPresenter/GospelPresenter.csproj \
            -f net10.0-maccatalyst \
            -c Release \
            -p:Scheme=GospelPresenterProd \
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.display }} \
            -p:ApplicationVersion=${{ github.run_number }}

      - name: Locate the built bundle
        id: bundle
        # A Release publish leaves THREE bundles: one per runtime identifier under
        # maccatalyst-x64/ and maccatalyst-arm64/, plus the merged universal one at the top. Only
        # the last is shippable, so this looks at maxdepth 1 rather than searching and taking the
        # first hit -- a single-architecture bundle would still run everywhere through Rosetta, so
        # picking the wrong one produces no error, just an app that is quietly slow on every Apple
        # Silicon Mac. The lipo check makes that failure loud instead.
        run: |
          set -euo pipefail
          app=$(find GospelPresenter/bin/Release/net10.0-maccatalyst -maxdepth 1 -name '*.app' -type d | head -1)
          if [ -z "$app" ]; then
            echo "::error::No .app bundle was produced by the publish step."
            exit 1
          fi

          archs=$(lipo -archs "$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")")
          if [[ "$archs" != *x86_64* || "$archs" != *arm64* ]]; then
            echo "::error::Expected a universal bundle, got '$archs' in $app."
            exit 1
          fi

          echo "path=$app" >> "$GITHUB_OUTPUT"
          echo "Bundle:       $app"
          echo "Architectures: $archs"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist"

      - name: Install the Velopack CLI
        # Pinned to the version the app references, so the package format the CLI writes and the
        # one the app reads cannot drift apart.
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Package the release
        run: |
          vpk pack \
            --packId "$PACK_ID" \
            --packVersion "${{ steps.version.outputs.semver }}" \
            --packDir "${{ steps.bundle.outputs.path }}" \
            --packAuthors "Gospel Presenter" \
            --channel "${{ steps.version.outputs.channel }}" \
            --outputDir Releases
          # TODO(signing): add these four once an Apple Developer Program membership exists, and
          # delete the warning at the top of this file.
          #   --signAppIdentity "Developer ID Application: <name> (<team id>)" \
          #   --signInstallIdentity "Developer ID Installer: <name> (<team id>)" \
          #   --signEntitlements GospelPresenter/Platforms/MacCatalyst/Entitlements.plist \
          #   --notaryProfile <notarytool keychain profile>

      - name: Force the installer to install per user
        # Velopack emits a Distribution with both enable_currentUserHome and enable_localSystem
        # true, and offers no option to change it. macOS Installer then shows a destination pane
        # defaulting to "Install for all users of this computer" -- which lands the app in
        # /Applications, where Velopack needs an admin password to replace the bundle on EVERY
        # update. On a shared volunteer machine that is a password nobody can supply, which is the
        # whole of decision (5) in the ADR.
        #
        # Safe to do after packing: the release manifests hash only the .nupkg, which is what the
        # updater actually downloads; the .pkg is listed by filename alone.
        #
        # TODO(signing): once the pkg is signed this step must run BEFORE signing, or the pkg has to
        # be re-signed afterwards with `productsign --sign "Developer ID Installer: ..."`. Flattening
        # a signed pkg invalidates its signature.
        run: |
          set -euo pipefail
          pkg=$(find Releases -name '*-Setup.pkg' | head -1)
          pkgutil --expand "$pkg" expanded-pkg
          sed -i '' 's/enable_localSystem="true"/enable_localSystem="false"/' expanded-pkg/Distribution
          grep -q 'enable_localSystem="false"' expanded-pkg/Distribution
          rm -f "$pkg"
          pkgutil --flatten expanded-pkg "$pkg"
          rm -rf expanded-pkg
          echo "Installer now offers only the per-user destination:"
          pkgutil --expand "$pkg" check-pkg && grep '<domains' check-pkg/Distribution && rm -rf check-pkg

      - name: Publish to GitHub Releases
        run: |
          vpk upload github \
            --repoUrl https://github.com/${{ github.repository }} \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --channel "${{ steps.version.outputs.channel }}" \
            --tag "${{ github.event.inputs.tag || github.ref_name }}" \
            --releaseName "${{ github.event.inputs.tag || github.ref_name }}" \
            --outputDir Releases \
            --merge true \
            --publish ${{ github.event.inputs.draft == 'true' && 'false' || 'true' }} \
            --pre ${{ steps.version.outputs.prerelease }}
          # A tag push always publishes; a manual run defaults to leaving a draft, so the pipeline
          # can be exercised end to end without putting an unsigned build in front of anyone.
          # --pre only decides which release GitHub badges as "Latest" on the web. It is NOT what
          # keeps betas away from stable installs -- the Velopack channel does that, which is why
          # the app's GithubSource passes prerelease: true and lets the channel filter.

name: Docker Image CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the web Docker image
        uses: docker/build-push-action@v7
        with:
          context: GospelPresenter
          file: GospelPresenter/GospelPresenter.Web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the migrations Docker image
        uses: docker/build-push-action@v7
        with:
          context: GospelPresenter
          file: GospelPresenter/GospelPresenter.MigrationService/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

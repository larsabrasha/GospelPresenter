# The Rust core (crates/gp-core), built to WASM for the web and the checks, and to a static library for apps/mac.
[workspace]
members = ["crates/gp-core", "crates/gp-core-ffi", "crates/gp-tui"]
# The collation data's generator, run by hand (crates/gp-core-collation/Cargo.toml); the desktop host's PowerPoint
# drawing (crates/gp-pptx), a workspace of its own, so building the core never fetches DeckCraft from git.
exclude = ["crates/gp-core-collation", "crates/gp-pptx"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

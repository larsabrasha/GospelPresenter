[package]
name = "gp-probe"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# The static library a native shell would link: the three crates and nothing of the app.
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "gp-probe"
path = "src/main.rs"

[dependencies]
deckcraft-pptx = { workspace = true }
deckcraft-anim = { workspace = true }
deckcraft-render = { workspace = true }
deckcraft-geom = { workspace = true }
deckcraft-model = { workspace = true }
kurbo = { workspace = true }

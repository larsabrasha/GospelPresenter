# A probe of way 3 in docs/native-slide-rendering.md: a song slide's text laid out and fitted in Rust, to compare its
# line breaks and fitted size with the browser's FittedText (README.md). A workspace of its own, not the app's.
[package]
name = "slide-layout"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
parley = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

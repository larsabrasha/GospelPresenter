# How the desktop app is packaged (D32, ADR 0007; docs/desktop-app.md). `pnpm --filter @gp/desktop release` makes the
# packages for this computer's system in release/.
appId: com.gospelpresenter.desktop
productName: Gospel Presenter
copyright: Gospel Presenter
directories:
  output: release
  buildResources: build
# Everything the main process needs is bundled into dist/ (build.mjs); no node_modules go along.
files:
  - dist/main.mjs
  - dist/preload.cjs
  - package.json
# The web app beside app.asar, where the main process looks for it (`../../web/dist` from dist/).
extraResources:
  - from: ../web/dist
    to: web/dist
  # The PowerPoint drawing (crates/gp-pptx), a program, so outside app.asar; host.ts finds it two up from dist/. And the
  # picture worker (apps/server/src/picture-worker.ts), a worker thread's file, which Node loads from a plain path.
  - from: dist/
    to: .
    filter: ['gp-pptx', 'gp-pptx.exe', 'picture-worker.mjs']
npmRebuild: false
# Sign-in hands the token back on this scheme (ADR 0005 (5)); the installer registers it.
protocols:
  - name: Gospel Presenter
    schemes:
      - gospelpresenter
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    # The zip is what electron-updater fetches, once there is a signature to update with.
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  # Ad-hoc signed until there is a Developer ID (D32): macOS blocks the first start, and the user allows it under
  # System Settings → Privacy & Security → "Open Anyway".
  identity: '-'
  hardenedRuntime: false
  notarize: false
  artifactName: Gospel-Presenter-${version}-${arch}-mac.${ext}
dmg:
  artifactName: Gospel-Presenter-${version}-${arch}.dmg
# A per-user installer without admin rights, not code-signed (D32).
win:
  target: nsis
nsis:
  oneClick: true
  perMachine: false
  artifactName: Gospel-Presenter-Setup-${version}.exe
# Packages are uploaded by the release workflow (.github/workflows/desktop-release.yml), never by electron-builder:
# the app has no updater yet, so there is no update feed to write.
publish: null
# Four packages, as 1.x had (Lars, 2026-11-26): "Linux" is not one thing. AppImage for any distribution; deb for
# Ubuntu, Debian, Mint, Pop!_OS; rpm for Fedora, RHEL, openSUSE; pacman for Arch, Omarchy, Manjaro. The three native
# ones install under /opt and register the scheme in their .desktop file. Built on Linux only (release workflow).
linux:
  target: [AppImage, deb, rpm, pacman]
  category: Office
  # An AppImage is decompressed at every start: gzip, not xz. The fpm targets name their own below, as fpm takes
  # gz/xz/… and not "normal".
  compression: normal
  # The program's name; package.json's, @gp/desktop, is no file name.
  executableName: gospel-presenter
  # deb and rpm refuse to build without a maintainer's address; noreply, a contact that says "not by mail".
  maintainer: Gospel Presenter <noreply@gospelpresenter.com>
  # The application menu's name; without it, the product name with dashes.
  desktop:
    entry:
      Name: Gospel Presenter
  artifactName: Gospel-Presenter-${version}-${arch}.${ext}
# What `apt remove`, `dnf remove` and `pacman -R` are given; package.json's name is @gp/desktop.
deb:
  packageName: gospel-presenter
  compression: xz
rpm:
  packageName: gospel-presenter
  compression: xz
pacman:
  packageName: gospel-presenter
  compression: xz
  # The whole list (fpm's customDepends): electron-builder's default names two packages Arch's repositories no longer
  # have (http-parser, libappindicator-gtk3), and pacman refuses a package it cannot resolve (1.x found this).
  depends: [c-ares, ffmpeg, gtk3, libevent, libvpx, libxslt, libxss, minizip, nss, re2, snappy, libnotify, libayatana-appindicator]

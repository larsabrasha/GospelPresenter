services:
  postgres:
    image: postgres:17
    container_name: gospelpresenter-db
    restart: always
    environment:
      POSTGRES_USER: gospelpresenter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gospelpresenter
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gospelpresenter"]
      interval: 5s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.2.0
    container_name: gospelpresenter-garage
    restart: always
    environment:
      GARAGE_ALLOW_WORLD_READABLE_SECRETS: "true"
    volumes:
      - garage-data:/var/lib/garage/data
      - garage-meta:/var/lib/garage/meta
      - ./garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "stats", "-a"]
      interval: 5s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gospelpresenter-gotenberg
    restart: always
    command:
      - gotenberg
      - --api-timeout=120s
      - --libreoffice-restart-after=10
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrations:
    image: ghcr.io/larsabrasha/gospelpresenter-migrations:${GP_VERSION:-latest}
    container_name: gospelpresenter-migrations
    environment:
      ConnectionStrings__postgresdb: "Host=postgres;Database=gospelpresenter;Username=gospelpresenter;Password=${POSTGRES_PASSWORD}"
      S3__Endpoint: http://garage:3900
      S3__AccessKey: ${S3_ACCESS_KEY}
      S3__SecretKey: ${S3_SECRET_KEY}
      S3__BucketName: ${S3_BUCKET_NAME:-gospelpresenter}
      S3__Region: garage
      S3__AdminEndpoint: http://garage:3903
      S3__AdminToken: ${S3_ADMIN_TOKEN:-gospelpresenter-admin-token}
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy

  web:
    image: ghcr.io/larsabrasha/gospelpresenter:${GP_VERSION:-latest}
    container_name: gospelpresenter-web
    restart: always
    ports:
      - "${WEB_PORT:-8082}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__postgresdb: "Host=postgres;Database=gospelpresenter;Username=gospelpresenter;Password=${POSTGRES_PASSWORD}"
      Settings__DataProtectionKeysDirectory: /app/data-protection-keys
      S3__Endpoint: http://garage:3900
      S3__AccessKey: ${S3_ACCESS_KEY}
      S3__SecretKey: ${S3_SECRET_KEY}
      S3__BucketName: ${S3_BUCKET_NAME:-gospelpresenter}
      S3__Region: garage
      Authentication__OpenIdConnect__Enabled: ${OIDC_ENABLED:-false}
      Authentication__OpenIdConnect__Authority: ${OIDC_AUTHORITY:-}
      Authentication__OpenIdConnect__ClientId: ${OIDC_CLIENT_ID:-}
      Authentication__OpenIdConnect__ClientSecret: ${OIDC_CLIENT_SECRET:-}
      Authentication__OpenIdConnect__DisplayName: ${OIDC_DISPLAY_NAME:-OpenID Connect}
      Authentication__Google__Enabled: ${GOOGLE_ENABLED:-false}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Gotenberg__Endpoint: http://gotenberg:3000
    volumes:
      - data-protection-keys:/app/data-protection-keys
      - ./bibles:/app/data/bibles:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      gotenberg:
        condition: service_healthy

  # Writes a backup into ${BACKUP_DIR} for the NAS to pull. Not started by `up`; run it
  # from cron with:  docker compose --profile backup run --rm backup
  backup:
    build: ./backup
    image: gospelpresenter-backup:local
    profiles: ["backup"]
    environment:
      PGHOST: postgres
      PGUSER: gospelpresenter
      PGDATABASE: gospelpresenter
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      S3_ENDPOINT: http://garage:3900
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-gospelpresenter}
      S3_REGION: garage
      GP_VERSION: ${GP_VERSION:-latest}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      HEALTHCHECK_URL: ${BACKUP_HEALTHCHECK_URL:-}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backup
      - data-protection-keys:/keys:ro
      # Same volume, writable, used only by restore.sh. Keeping the backup job's own
      # mount read-only means a bug in it cannot destroy the keys it is meant to save.
      - data-protection-keys:/keys-restore
      - ./.env:/config/env:ro
      - ./garage.toml:/config/garage.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy

volumes:
  postgres-data:
  data-protection-keys:
  garage-data:
  garage-meta:

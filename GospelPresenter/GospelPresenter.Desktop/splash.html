<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gospel Presenter</title>
</head>
<!--
    Shown by the Electron host from the moment the process starts until the operator window exists,
    which is the part of startup that used to be a blank screen: Electron spawns the .NET process,
    and nothing can be drawn until ASP.NET Core has built the host, brought the local database up to
    date and started listening. See ElectronSplashScreen in the csproj for the wiring.

    Deliberately a single self-contained file with no build step and no assets. It is loaded over
    file:// from the packaged app directory before any server is listening, so anything it referenced
    -- a stylesheet, Tailwind, the app icon -- would have to be a second file copied to the right
    place at package time, and would show a broken splash if it ever was not. That is also why the
    palette below is hex rather than Tailwind classes: the tokens are named in the variables so the
    values are traceable to the ones MainLayout uses, which is as close to sharing them as a file
    outside the build can get.

    The window is created by the host as 800x600, frameless and transparent; the size is not
    configurable from the manifest, so the layout fills whatever it is given rather than centring a
    fixed-size card. The background is opaque on purpose: a transparent window renders black rather
    than blending on a Linux desktop with no compositor, which is exactly the kind of machine this
    app runs on.

    Light and dark both, per the project's UI rules. The app's own theme is a localStorage value
    ('light', 'dark' or 'system' -- see utils.js), which a file:// page loaded before the server is
    listening cannot read, so this follows the OS instead. That is right for 'system', which is the
    default; someone who has explicitly overridden the theme gets a splash matching their desktop
    rather than their override, which is the closest an unaskable question can be answered.

    The mark and the wordmark repeat MainLayout's. The mark is a copy of LogoSymbol.razor's path
    rather than a reference to it -- a <img src> would be the second file this page cannot have, and
    the app's own SVG is served by a server that is not listening yet. It is a copy in the plain
    sense: same path data, same 24-unit coordinate space, only the matrix folded into the viewBox
    (LogoSymbol scales a 24-unit path into a 1024 box; 1024/24 is exactly the 42.6667 it uses). If
    the logo is ever redrawn, this file is a place that has to be redrawn with it.

    System fonts rather than the app's Inter: one file, no font loading, and a splash that is
    already gone by the time a webfont would have arrived.
-->
<body>
<style>
    :root {
        /* neutral-100 and neutral-300. A shade off white rather than MainLayout's own bg-white:
           this is a frameless window floating over the desktop, and pure white reads as a missing
           background rather than a surface. The dark block below overrides both. */
        --surface: #f5f5f5;
        --track: #d4d4d4;

        /* sky-500 and sky-400: the brand pair, and NOT theme-dependent. Every other place the
           logo appears -- MainLayout, Setup, Login, Home, InvitePage, WelcomeModal, and the
           marketing site's header -- writes text-sky-500 for the mark and "Gospel" and
           text-sky-400 for "Presenter", with no dark: variant on any of them. The surface below
           them changes with the theme; the mark does not. So these two are defined once, outside
           the dark block, and the dark block overrides only the surface and the track. */
        --gospel: #0ea5e9;
        --presenter: #38bdf8;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            /* neutral-800, the surface MainLayout uses under `dark:`. */
            --surface: #262626;
            --track: #404040;
        }
    }

    html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
    }

    body {
        background: var(--surface);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.5rem;
        user-select: none;
    }

    /*
        The mark and the wordmark are one unit with the tight gap Setup.razor gives them, and the
        2.5rem on the body is what separates that unit from the progress bar.
    */
    .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
    }

    /* var(--gospel) is sky-500, which is what every LogoSymbol in the app is given. */
    .mark {
        width: 6.5rem;
        height: 6.5rem;
        color: var(--gospel);
    }

    .wordmark {
        font-size: 2.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        white-space: nowrap;
    }

    .gospel { color: var(--gospel); }
    .presenter { color: var(--presenter); }

    .track {
        width: 13rem;
        height: 3px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
    }

    /*
        Indeterminate on purpose: the host has no progress to report, and a bar that pretended to
        know would be lying about a wait whose length depends on the machine. This says "working",
        which is the whole job.
    */
    .track::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: var(--gospel);
        animation: slide 1.4s ease-in-out infinite;
    }

    @keyframes slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
    }

    /* A splash cannot be dismissed, so a user who cannot see the animation gets a static bar
       rather than a hint that something is stuck. */
    @media (prefers-reduced-motion: reduce) {
        .track::after {
            width: 100%;
            animation: none;
        }
    }
</style>

<div class="brand">
    <svg class="mark" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4.5,5.653C4.5,4.226 6.029,3.323 7.279,4.01L18.819,10.357C20.114,11.069 20.114,12.93 18.819,13.643L10.898,18C10.883,18.008 10.852,17.994 10.852,17.977L10.852,14.109C10.852,14.087 10.876,14.063 10.898,14.063L12.703,14.063C12.725,14.062 12.749,14.038 12.75,14.016L12.75,12.867C12.749,12.845 12.725,12.821 12.703,12.82L10.898,12.82C10.876,12.82 10.852,12.796 10.852,12.773L10.852,10.969C10.851,10.947 10.827,10.923 10.805,10.922L9.656,10.922C9.634,10.923 9.61,10.947 9.609,10.969L9.609,12.773C9.609,12.796 9.585,12.82 9.563,12.82L7.758,12.82C7.736,12.821 7.712,12.845 7.711,12.867L7.711,14.016C7.712,14.038 7.736,14.062 7.758,14.063L9.562,14.062C9.585,14.063 9.609,14.087 9.609,14.109L9.609,18.656C9.609,18.687 9.589,18.719 9.563,18.735L7.28,19.99C6.03,20.677 4.501,19.773 4.501,18.347L4.501,5.653L4.5,5.653Z"/>
    </svg>
    <div class="wordmark"><span class="gospel">Gospel</span> <span class="presenter">Presenter</span></div>
</div>
<div class="track"></div>
</body>
</html>

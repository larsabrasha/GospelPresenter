# Packaging for the **Test** scheme — the build that talks to apptest.gospelpresenter.com. Selected
# by ElectronBuilderJson in Directory.Build.GospelPresenterTest.props. Deliberately close to
# electron-builder.yml rather than sharing with it: electron-builder's `extends` is for presets, not
# for a sibling file, and two readable files beat one file with conditions it has no syntax for.
#
# It differs from the real app's config in exactly two ways, and both are the point:
#   - no publish provider, so this build has no update feed (see below)
#   - a different protocol scheme, so it cannot take the real app's sign-ins
#
# The identity — bundle id, product name, icon — comes from the props file, not from here.

$schema: https://raw.githubusercontent.com/electron-userland/electron-builder/refs/heads/master/packages/app-builder-lib/scheme.json

compression: maximum

icon: bin/icon.png

# Names the scheme so a test installer and a real one can sit in the same downloads folder without
# one overwriting the other. ${os} for the same reason as the real config: the extension alone only
# tells you the platform if you already know what a .dmg is.
artifactName: gospel-presenter-test-${os}-${arch}-${version}.${ext}

# No `publish:`. adr/0002 (9) put beta testers on the production server, on the grounds that "a
# beta that runs against test data is never used on a Sunday and therefore finds nothing" — which
# leaves Test as a developer build with an audience of one, and nothing for an update feed to do.
#
# It is also the safe answer rather than merely the cheap one. The only feed configured anywhere is
# this repository's GitHub Releases, so a test build that carried one would read the same manifests
# the real app does and update itself into the real app — same bundle id it does not have, same
# database it must not touch. A channel would separate them, but a channel is machinery to maintain
# for a build that nobody needs updated in place.
#
# The consequence, deliberately: electron-builder writes no app-update.yml, and the app does not
# register IAppUpdater at all (DesktopBuild.HasUpdateFeed). To get a new test build, download it.

# Not gospelpresenter://. See CallbackScheme in Directory.Build.GospelPresenterTest.props for why,
# and keep the two in step — this is the OS's half of that agreement.
protocols:
  - name: Gospel Presenter Test
    schemes:
      - gospelpresenter-test

# zip alongside dmg is what Squirrel.Mac would update from. Kept even with no feed, because dropping
# it would make this config differ from the real one in a third way, for no gain — the zip costs
# build time and nothing else.
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  # .NET 10 supports macOS 14 and later; Electron alone would declare 10.15, which knows nothing
  # about the runtime sitting beside it in the bundle.
  minimumSystemVersion: "14.0"

win:
  target:
    - target: nsis
      arch: x64

nsis:
  oneClick: true
  perMachine: false

linux:
  # An AppImage decompresses at every launch rather than once at install, so xz is paid for on the
  # startup path forever. Kept in step with electron-builder.yml, which carries the full reasoning —
  # a test build that started measurably slower than the real one would be a bad place to measure.
  compression: normal
  # The same four as the real build, and this is the config where that matters most: this is the
  # build you install on an actual Ubuntu and an actual Arch machine to find out whether the package
  # works, before a v* tag makes the same question a release. All four come out of one .NET publish
  # — electron-builder packages the staged app directory once per target — so the extra formats cost
  # packaging time, not build time.
  target:
    - AppImage
    - deb
    - rpm
    - pacman
  executableArgs:
    - --no-sandbox
  category: Office

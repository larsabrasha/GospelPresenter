[package]
name = "gp-tui"
version = "0.1.0"
edition = "2021"
description = "Gospel Presenter in a terminal: the Rust core in-process over an organisation's SQLite (docs/tui.md)."

[[bin]]
name = "gp"
path = "src/main.rs"

[dependencies]
# The core as the native shells take it, without slideLayoutView: a terminal draws a slide's text, not its glyphs.
gp-core = { path = "../gp-core" }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
# SQLite built in, so the binary runs where no system SQLite is new enough (a Raspberry Pi's, an old machine's).
rusqlite = { version = "0.37", features = ["bundled"] }
# 0.30, not 0.29: 0.29 pins unicode-width at =0.2.0, which would take the workspace's textwrap back from 0.2.3.
ratatui = "0.30"
# The device's date for the start page (`today`) and a date's Swedish name ("ons 19 november").
chrono = { version = "0.4", default-features = false, features = ["clock", "unstable-locales"] }

[package]
name = "gp-core-ffi"
version = "0.1.0"
edition = "2021"

# The Rust core for the native shells, through UniFFI (docs/native-apps.md): a static library for the apps. Only a
# static one, so the Mac's linker never takes a dynamic one beside it; bindings.sh makes a dynamic one of its own to
# generate the Swift bindings from (uniffi-bindgen reads the library's metadata).
[lib]
name = "gp_core_ffi"
crate-type = ["staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
gp-core = { path = "../gp-core" }
serde_json = { version = "1", features = ["float_roundtrip"] }
uniffi = "=0.32.2"

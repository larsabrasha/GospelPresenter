[package]
name = "gp-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "gp_core"
# cdylib: the WASM; rlib: under crates/gp-core-ffi, the native shells' library.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
unicode-normalization = "0.1"

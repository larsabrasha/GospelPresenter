[package]
name = "gp-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "gp_core"
# cdylib: the WASM; rlib: under crates/gp-core-ffi, the native shells' library.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Ordering by name in the page's language (collation.rs), with the data of src/collation_data only. ICU4X 2.3, not
# 2.4: parley's line breaking pins its segmenter to ~2.3, and ICU4X's crates move together.
icu_collator = { version = "~2.3", default-features = false }
icu_collections = "~2.3"
icu_locale_core = "~2.3"
icu_locale_fallback = { version = "~2.3", features = ["compiled_data"] }
icu_normalizer = { version = "~2.3", default-features = false }
icu_provider = { version = "~2.3", features = ["baked"] }
zerovec = "0.11"
# A slide's text laid out and fitted as the web's FittedText does (slide_layout.rs), over the faces in fonts/ only:
# no system fonts, so every shell lays out with the same ones. Only with the `layout` feature (the native shells):
# the web draws with SlideView, and parley, its line breaking data and the faces would double its WASM (2.0 to 3.8
# MB, 486 to 979 kB with brotli, measured 2026-11-19).
parley = { version = "0.13", default-features = false, features = ["std"], optional = true }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# The views' answers as types (view_types.rs), and with the `schema` feature their JSON Schema, from which the shells'
# own types are generated (docs/view-models.md, "Typed"); the WASM goes without schemars.
serde = { version = "1", features = ["derive"] }
schemars = { version = "1.2", optional = true }
# A Bible text is named by the SHA-256 of its canonical JSON (bible_texts.rs), checked in the core for every shell.
sha2 = { version = "0.10", default-features = false }
unicode-normalization = "0.1"

[features]
# slideLayoutView (slide_layout.rs): crates/gp-core-ffi turns it on for the native shells; the WASM goes without.
layout = ["dep:parley"]
# The views' JSON Schema (examples/schema.rs writes it), for the shells' generated types.
schema = ["dep:schemars"]

[dev-dependencies]
# The view types' schema in every `cargo test`, which checks schema/views.json follows them (view_types.rs).
schemars = "1.2"

# Only with the `schema` feature: a plain build or test leaves it out.
[[example]]
name = "schema"
required-features = ["schema"]
